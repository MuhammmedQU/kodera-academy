# Kodera Academy — Supabase CLI Configuration for kodera-dev (No Secrets)
# For cloud staging (`kodera-dev`), also configure Site URL and exact Redirect URLs
# in Supabase Dashboard -> Authentication -> URL Configuration:
#   Site URL: https://<your-staging-preview-domain>.vercel.app
#   Redirect URLs:
#     https://<your-staging-preview-domain>.vercel.app/login
#     https://<your-staging-preview-domain>.vercel.app/reset-password
project_id = "kodera-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seeds/01_python_intro_modules.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/login",
  "http://localhost:5173/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Matches Supabase Cloud default so authenticated sessions can update password via
# `supabase.auth.updateUser({ password })` without requiring a separate OTP nonce template.
secure_password_change = false

[storage]
enabled = true
file_size_limit = "5MiB"
